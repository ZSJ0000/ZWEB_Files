name: Extract Minecraft Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Download split archives with Python API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          token = os.environ['GH_TOKEN']
          h = {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'ZWEB-Actions'
          }
          api = 'https://api.github.com/repos/ZSJ0000/ZWEB_Files/releases/tags/minecraft-files'
          req = urllib.request.Request(api, headers=h)
          with urllib.request.urlopen(req) as r:
              release = json.load(r)
          assets = {a['name']: a['url'] for a in release['assets']}
          names = [f'Minecraft-Release.7z.{i:03d}' for i in range(1, 7)]
          for name in names:
              if name not in assets:
                  raise SystemExit('Missing asset: ' + name)
              print('Downloading', name)
              dh = dict(h)
              dh['Accept'] = 'application/octet-stream'
              req = urllib.request.Request(assets[name], headers=dh)
              with urllib.request.urlopen(req) as r, open(name, 'wb') as f:
                  while True:
                      b = r.read(1024 * 1024)
                      if not b:
                          break
                      f.write(b)
          PY

      - name: Test and extract archive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full
          7z t Minecraft-Release.7z.001
          mkdir extracted
          7z x Minecraft-Release.7z.001 -oextracted

      - name: Create downloadable archive
        run: tar -czf Minecraft-Release-extracted.tar.gz -C extracted .

      - name: Upload extracted files
        uses: actions/upload-artifact@v4
        with:
          name: Minecraft-Release-extracted
          path: Minecraft-Release-extracted.tar.gz
          retention-days: 7
